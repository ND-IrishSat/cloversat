[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cloversat"
version = "0.0.0"
description = "CloverSat flight software (ADCS + executive) and simulation"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "sgp4"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["cloversat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
